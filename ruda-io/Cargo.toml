[package]
name = "ruda-io"
version = "0.21.3"
edition = "2024"
authors = ["Dilshod Tadjibaev (@antimora)"]
description = "Ruda host-side input/output utilities."
license = "MIT OR Apache-2.0"
repository = "https://github.com/shuqi2077/RUDA/tree/main/ruda-io"
readme = "README.md"
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "ruda_io"
path = "src/lib.rs"

[features]
default = ["std"]
std = []
network = ["dep:indicatif", "dep:reqwest", "dep:tokio"]

[dependencies.indicatif]
version = "0.18.0"
optional = true

[dependencies.reqwest]
version = "0.12.23"
features = ["rustls-tls"]
optional = true
default-features = false

[dependencies.tokio]
version = "1.51.1"
features = ["rt", "macros"]
optional = true
