[package]
name = "ruFFT-host"
edition = "2024"
authors = [ "Dilshod Tadjibaev (@antimora)",]
license = "MIT OR Apache-2.0"
description = "ruFFT CPU real transforms, twiddle tables and SIMD butterflies."
readme = false
build = false
repository = "https://github.com/shuqi2077/RUDA"

[lib]
name = "rufft_host"
path = "src/lib.rs"

[features]
default = [ "std", "simd", "rayon",]
std = [ "ruda-core/std", "half/std",]
simd = [ "dep:macerator",]
rayon = [ "dep:rayon",]

[package.version]
workspace = true

[dependencies.bytemuck]
version = "1.25.0"

[dependencies.half]
version = "2.7.1"
features = [ "alloc", "num-traits", "serde",]
default-features = false

[dependencies.libm]
version = "0.2"

[dependencies.macerator]
version = "0.3.0"
optional = true

[dependencies.rayon]
version = "1.10.0"
optional = true

[dependencies.ruda-core]
path = "../../ruda-core"
version = "0.1.0"
default-features = false
features = [ "tensor-host-storage",]

[dev-dependencies.realfft]
version = "3"
