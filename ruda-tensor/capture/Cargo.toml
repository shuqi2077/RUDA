[package]
name = "ruda-tensor-capture"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Non-executing tensor backend for capturing operation graphs and initialized values."

[features]
default = ["std"]
std = ["ruda-core/std", "ruda-tensor/std", "ruda-tensor-router/std"]
fusion = ["std", "ruda-tensor-router/fusion"]

[dependencies]
ruda-core = { version = "0.1.14", path = "../../ruda-core", default-features = false }
ruda-tensor = { version = "0.21.89", path = "..", default-features = false, features = ["graph"] }
ruda-tensor-router = { version = "0.21.81", path = "../router", default-features = false }
spin = { version = "0.10.0", default-features = false, features = ["mutex", "spin_mutex", "portable-atomic"] }
