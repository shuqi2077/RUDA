[package]
name = "ruda-tensor-dispatch"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "Runtime backend dispatch for RUDA tensors."

[features]
default = ["std"]
distributed = ["std", "ruda-tensor/distributed", "ruda-autodiff/distributed", "ruda-tensor-device?/distributed", "ruda-fusion?/distributed", "ruda-tensor-tch?/distributed", "ruda-tensor-remote?/distributed"]
std = ["ruda-tensor/std", "ruda-core/std", "ruda-autodiff/std", "ruda-tensor-host/std", "ruda-tensor-capture?/std", "ruda-runtime?/runtime-std", "ruda-kernel?/std"]
throughput = ["dep:ruda-runtime", "dep:ruda-kernel"]
capture = ["dep:ruda-tensor-capture"]
cuda = ["std", "throughput", "dep:ruda-tensor-device", "ruda-tensor-device/cuda", "ruda-tensor-device/std"]
cpu = ["std", "throughput", "ruda-tensor/cpu", "dep:ruda-tensor-device", "ruda-tensor-device/std", "dep:ruda-driver-cpu"]
wgpu = ["std", "throughput", "dep:ruda-tensor-wgpu", "ruda-tensor-wgpu/std"]
vulkan = ["wgpu", "ruda-tensor-wgpu/vulkan"]
metal = ["wgpu", "ruda-tensor-wgpu/metal"]
webgpu = ["wgpu", "ruda-tensor-wgpu/webgpu"]
rocm = ["std", "throughput", "dep:ruda-tensor-rocm", "ruda-tensor-rocm/std"]
tch = ["std", "dep:ruda-tensor-tch"]
remote = ["std", "dep:ruda-tensor-remote"]
remote-server = ["remote", "ruda-tensor-remote/server", "ruda-tensor/graph"]
iroh = ["remote", "ruda-tensor-remote/iroh"]
fusion = ["std", "dep:ruda-fusion", "ruda-tensor-device?/fusion", "ruda-tensor-wgpu?/fusion", "ruda-tensor-rocm?/fusion", "ruda-tensor-capture?/fusion", "ruda-tensor-remote?/fusion"]
autotune = ["ruda-tensor-device?/autotune", "ruda-tensor-wgpu?/autotune", "ruda-tensor-rocm?/autotune"]

[dependencies]
ruda-runtime = { version = "0.1.34", path = "../../ruda-runtime", default-features = false, features = ["runtime"], optional = true }
ruda-kernel = { version = "0.1.59", path = "../../ruda-kernel", default-features = false, features = ["library"], optional = true }
ruda-tensor = { version = "0.21.93", path = "..", default-features = false }
ruda-core = { version = "0.1.14", path = "../../ruda-core", default-features = false, features = ["ir"] }
ruda-autodiff = { version = "0.21.77", path = "../../ruda-autodiff", default-features = false }
ruda-fusion = { version = "0.21.92", path = "../../ruda-fusion", default-features = false, features = ["std"], optional = true }
ruda-tensor-host = { version = "0.21.90", path = "../host", default-features = false }
ruda-tensor-capture = { version = "0.2.11", path = "../capture", default-features = false, optional = true }
ruda-tensor-device = { version = "0.21.93", path = "../device", default-features = false, optional = true }
ruda-driver-cpu = { version = "0.2.12", path = "../../ruda-driver/cpu", optional = true }
ruda-tensor-wgpu = { version = "0.21.91", path = "../wgpu", default-features = false, optional = true }
ruda-tensor-rocm = { version = "0.21.92", path = "../rocm", default-features = false, optional = true }
ruda-tensor-tch = { version = "0.21.96", path = "../tch", default-features = false, optional = true }
ruda-tensor-remote = { version = "0.21.66", path = "../remote", default-features = false, features = ["client"], optional = true }
