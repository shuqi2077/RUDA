[package]
name = "ruTENSOR"
version.workspace = true
edition.workspace = true
description = "Ruda tensor contractions, reductions, permutations and elementwise operations"
license-file = "LICENSE"
repository = "https://github.com/shuqi2077/RUDA"

[lib]
name = "rutensor"

[features]
cann = ["dep:ruda-driver-cann"]
default = ["std"]
std = ["ruda-core/std", "ruda-kernel/frontend-std"]

[dependencies]
half = { version = "2.7.1", default-features = false }
rublas = { version = "0.3.0", path = "../ruBLAS", default-features = false, features = ["tensor-matmul"] }
ruda-driver-cann = { version = "0.3.0", path = "../ruda-driver/cann", optional = true }
ruda-core = { version = "0.1.14", path = "../ruda-core", default-features = false, features = ["tensor"] }
ruda-kernel = { version = "0.1.59", path = "../ruda-kernel", default-features = false, features = ["kernel-ir", "device-tensor"] }

[lints.rust]
unsafe_code = "deny"
