name: Model compiler host validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ruda-torch/python/**'
      - 'ruda-torch/tools/check_cpp_bridge.py'
      - '.github/workflows/model-compiler-host.yml'
  push:
    paths:
      - 'ruda-torch/python/**'
      - 'ruda-torch/tools/check_cpp_bridge.py'
      - '.github/workflows/model-compiler-host.yml'

jobs:
  python-aot-and-cpp-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reference dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest safetensors numpy transformers==4.57.1 accelerate==1.13.0
      - name: CPU model and native-region simulator tests
        run: |
          python -m pytest -q \
            ruda-torch/python/tests/test_model_compile.py \
            ruda-torch/python/tests/test_finetuning.py \
            ruda-torch/python/tests/test_causal_finetuning.py \
            ruda-torch/python/tests/test_sequence_training.py \
            ruda-torch/python/tests/test_native_training_contracts.py \
            ruda-torch/python/tests/test_compile_native.py \
            ruda-torch/python/tests/test_static_graph_spec.py \
            ruda-torch/python/tests/test_static_graph_optimizer.py \
            ruda-torch/python/tests/test_static_graph_training.py \
            --junitxml=model-compiler-python.xml
      - name: Compile actual C++ bridge and test host protocols
        run: |
          python ruda-torch/tools/check_cpp_bridge.py \
            --compiler clang++ --static-graph --output model-compiler-cpp
          library="$(find model-compiler-cpp -maxdepth 1 -name '_C*.so' -print -quit)"
          test -n "$library" && test -f "$library"
          RUDA_CPP_TEST_LIBRARY="$(realpath "$library")" python -m pytest -q \
            ruda-torch/python/tests/test_model_compile_cpp.py \
            --junitxml=model-compiler-cpp/model-tracing.xml
      - name: Reject empty/skipped test suites
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ('model-compiler-python.xml', 'model-compiler-cpp/model-tracing.xml'):
              cases = list(ET.parse(path).getroot().iter('testcase'))
              assert cases and all(c.find(tag) is None for c in cases
                                   for tag in ('skipped', 'error', 'failure')), path
          PY
