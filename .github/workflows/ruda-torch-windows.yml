name: RUDA Torch wheels

on:
  push:
    branches: [main, build/ruda-torch-windows]
    paths:
      - 'ruda-torch/**'
      - 'ruda/**'
      - 'ruda-runtime/**'
      - 'ruda-core/**'
      - 'ruda-kernel/**'
      - 'ruda-kernel-macros/**'
      - 'ruda-ir-macros/**'
      - 'ruda-compiler/**'
      - 'ruda-driver/cuda/**'
      - 'ruPRIM/**'
      - 'ruDNN/**'
      - 'ruBLAS/**'
      - 'ruRAND/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/ruda-torch-windows.yml'
  workflow_dispatch:
    inputs:
      compile_only:
        description: Build without running tests or runtime checks
        type: boolean
        default: false
      python_version:
        description: CPython version to build both platform wheels for
        type: string
        default: '3.13.7'
      linux_torch_version:
        description: Exact Linux PyTorch version including its CUDA suffix
        type: string
        default: '2.10.0+cu126'
      linux_torch_index:
        description: PyTorch wheel index for the Linux build
        type: string
        default: 'https://download.pytorch.org/whl/cu126'
      windows_torch_version:
        description: Exact Windows PyTorch version including its CUDA suffix
        type: string
        default: '2.13.0+cu130'
      windows_torch_index:
        description: PyTorch wheel index for the Windows build
        type: string
        default: 'https://download.pytorch.org/whl/cu130'
      release_tag:
        description: Optional new GitHub Release tag matching the workspace version
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ruda-torch-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_STRIP: debuginfo
  CARGO_TERM_COLOR: never
  RUST_MIN_STACK: '16777216'
  PYTHONUNBUFFERED: '1'
  PIP_NO_CACHE_DIR: '1'

jobs:
  native:
    name: Windows Rust DLL
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inspect runner resources
        run: |
          Get-Date -AsUTC -Format o
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          if ((Get-Item $env:GITHUB_WORKSPACE).PSDrive.Free -lt 6GB) { throw 'Insufficient disk space for the bounded Rust build' }
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup override set 1.97.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustc --version
          cargo --version
      - name: Restore Rust build cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: torch-win-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            torch-win-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-
            torch-win-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
            torch-win-release-rust-1.97.1-
      - name: Build native DLL
        timeout-minutes: 60
        run: cargo build --release --locked -p ruda-torch-native
      - name: Save native DLL
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruda-torch-native-win-amd64-abi10-${{ github.sha }}
          path: target/release/ruda_torch_native.dll
          if-no-files-found: error
          retention-days: 7
      - name: Save Rust build cache
        if: always() && steps.cargo-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  linux:
    name: Linux native and Python wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      python_version: ${{ steps.compatibility.outputs.python_version }}
      python_tag: ${{ steps.compatibility.outputs.python_tag }}
      abi_tag: ${{ steps.compatibility.outputs.abi_tag }}
      torch_version: ${{ steps.compatibility.outputs.torch_version }}
    defaults:
      run:
        shell: bash
    env:
      CXX: clang++
      CARGO_PROFILE_TEST_DEBUG: '0'
      TORCH_VERSION: ${{ inputs.linux_torch_version || '2.10.0+cu126' }}
      TORCH_INDEX: ${{ inputs.linux_torch_index || 'https://download.pytorch.org/whl/cu126' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python_version || '3.13.7' }}
      - name: Inspect runner resources
        run: |
          date -u
          nproc
          free -m
          df -h "$GITHUB_WORKSPACE"
          test "$(df --output=avail -k "$GITHUB_WORKSPACE" | tail -1)" -ge 10485760
      - name: Install Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup override set 1.97.1
      - name: Restore Linux build cache
        id: linux-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: torch-linux-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            torch-linux-release-rust-1.97.1-${{ hashFiles('Cargo.lock') }}-
            torch-linux-release-rust-1.97.1-
      - name: Compile and validate native attention PTX
        run: |
          RUDA_PTX_TEST_OUTPUT="$GITHUB_WORKSPACE/target/ptx-vector-memory" cargo test --release --locked -p ruda-compiler --no-default-features --features ptx ptx::tests
          cargo test --release --locked -p ruDNN --test flash-training-layout --features tensor-paged-attention,ruda-test-runtime/cuda
          RUDA_FLASH_PTX_OUTPUT="$GITHUB_WORKSPACE/target/ptx-flash-training" cargo test --release --locked -p ruDNN --test flash-training-ptx --features tensor-paged-attention,ruda-test-runtime/cuda
      - name: Save attention PTX for early GPU validation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruda-attention-ptx-${{ github.sha }}
          path: |
            target/ptx-vector-memory/compound_vector_component_*.ptx
            target/ptx-vector-memory/constant_register_mma_*.ptx
            target/ptx-flash-training/*.ptx
          if-no-files-found: error
          retention-days: 14
      - name: Build native library and compile CUDA attention tests without execution
        run: |
          cargo build --release --locked -p ruda-torch-native
          cargo check --release --locked -p ruDNN --lib --tests --features tensor-paged-attention,ruda-test-runtime/cuda
          test "$(find target/ptx-vector-memory -maxdepth 1 -name 'packed_vector_memory_*.ptx' | wc -l)" -eq 48
          test "$(find target/ptx-vector-memory -maxdepth 1 -name 'unsigned_power2_*.ptx' | wc -l)" -eq 288
          test "$(find target/ptx-vector-memory -maxdepth 1 -name 'async_groups_*.ptx' | wc -l)" -eq 8
          cargo test --release --locked -p ruda-driver-cuda --features direct-ptx --test graph-update --no-run --message-format=json > target/graph-update-build.jsonl
          python -c "import json, shutil; rows=[json.loads(line) for line in open('target/graph-update-build.jsonl')]; binaries=[row['executable'] for row in rows if row.get('reason')=='compiler-artifact' and row.get('target',{}).get('name')=='graph-update' and row.get('executable')]; assert len(binaries)==1, binaries; shutil.copyfile(binaries[0], 'target/release/ruda_graph_update_test')"
          cargo test --release --locked -p rublas --lib --features tensor-matmul,ruda-test-runtime/cuda --no-run --message-format=json,json-render-diagnostics > target/training-mma-build.jsonl
          python -c "import json, shutil; rows=[json.loads(line) for line in open('target/training-mma-build.jsonl')]; binaries=[row['executable'] for row in rows if row.get('reason')=='compiler-artifact' and row.get('target',{}).get('name')=='rublas' and row.get('executable')]; assert len(binaries)==1, binaries; shutil.copyfile(binaries[0], 'target/release/ruda_training_mma_test')"
          chmod +x target/release/ruda_training_mma_test
          target/release/ruda_training_mma_test --exact tensor_matmul::training_mma::tests::manual_training_epilogue_swizzle_preserves_coordinates_and_bank_transactions
          target/release/ruda_training_mma_test --exact tensor_matmul::training_mma::tests::manual_training_compact_offsets_match_full_fragment_addresses
          target/release/ruda_training_mma_test --exact tensor_matmul::training_mma::tests::manual_training_vector_load_offsets_preserve_coordinates
          target/release/ruda_training_mma_test --exact tensor_matmul::training_mma::tests::manual_training_fragment_prefetch_preserves_k_order
          target/release/ruda_training_mma_test --exact tensor_matmul::training_mma::tests::manual_training_warp_grid_covers_each_output_once
          cp target/release/libruda_torch_native.so ruda-torch/python/ruda_torch/
      - name: Save Linux native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruda-torch-native-linux-x86_64-abi10-${{ github.sha }}
          path: |
            target/release/libruda_torch_native.so
            target/release/ruda_graph_update_test
            target/release/ruda_training_mma_test
            target/ptx-vector-memory/packed_vector_memory_*.ptx
            target/ptx-vector-memory/unsigned_power2_*.ptx
            target/ptx-vector-memory/async_groups_*.ptx
            target/ptx-vector-memory/compound_vector_component_*.ptx
            target/ptx-vector-memory/constant_register_mma_*.ptx
            target/ptx-flash-training/*.ptx
          compression-level: 6
          if-no-files-found: error
          retention-days: 14
      - name: Save Linux build cache
        if: always() && steps.linux-cache.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ steps.linux-cache.outputs.cache-primary-key }}
      - name: Install selected Torch and build dependencies
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 packaging==25.0
          python -m pip install "torch==$TORCH_VERSION" --index-url "$TORCH_INDEX"
      - name: Record wheel build ABI
        id: compatibility
        run: |
          python -c "import sys, torch; from packaging.tags import sys_tags; tag = next(sys_tags()); print('python_version=%d.%d' % sys.version_info[:2]); print('python_tag=' + tag.interpreter); print('abi_tag=' + tag.abi); print('torch_version=' + torch.__version__)" >> "$GITHUB_OUTPUT"
      - name: Check Python syntax and build Linux wheel
        working-directory: ruda-torch/python
        run: |
          python -m compileall -q ruda_torch tests
          if [ '${{ inputs.compile_only }}' != 'true' ]; then python tests/check_spatial_schemas.py; fi
          python setup.py bdist_wheel
          if [ '${{ inputs.compile_only }}' != 'true' ]; then python tests/check_native_load.py; fi
      - name: Save Linux wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruda-torch-linux-x86_64-${{ steps.compatibility.outputs.python_tag }}-${{ steps.compatibility.outputs.abi_tag }}-torch${{ steps.compatibility.outputs.torch_version }}-abi10-${{ github.sha }}
          path: ruda-torch/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  wheel:
    name: Windows Python wheel
    needs: native
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      python_version: ${{ steps.compatibility.outputs.python_version }}
      python_tag: ${{ steps.compatibility.outputs.python_tag }}
      abi_tag: ${{ steps.compatibility.outputs.abi_tag }}
      torch_version: ${{ steps.compatibility.outputs.torch_version }}
    env:
      TORCH_VERSION: ${{ inputs.windows_torch_version || '2.13.0+cu130' }}
      TORCH_INDEX: ${{ inputs.windows_torch_index || 'https://download.pytorch.org/whl/cu130' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ inputs.python_version || '3.13.7' }}
          architecture: x64
      - name: Inspect runner resources
        run: |
          Get-Date -AsUTC -Format o
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize, FreePhysicalMemory
          Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free
          if ((Get-Item $env:GITHUB_WORKSPACE).PSDrive.Free -lt 10GB) { throw 'Insufficient disk space for the PyTorch wheel build' }
      - name: Install matching PyTorch and build dependencies
        timeout-minutes: 8
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 packaging==25.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip install "torch==$env:TORCH_VERSION" --index-url "$env:TORCH_INDEX"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record wheel build ABI
        id: compatibility
        run: |
          python -c "import sys, torch; from packaging.tags import sys_tags; tag = next(sys_tags()); print('python_version=%d.%d' % sys.version_info[:2]); print('python_tag=' + tag.interpreter); print('abi_tag=' + tag.abi); print('torch_version=' + torch.__version__)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Restore native DLL
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ruda-torch-native-win-amd64-abi10-${{ github.sha }}
          path: ruda-torch/python/ruda_torch
      - name: Check Python syntax and registered ATen schemas (no GPU execution)
        working-directory: ruda-torch/python
        run: |
          python -m compileall -q ruda_torch tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ inputs.compile_only }}' -ne 'true') {
            python tests/check_spatial_schemas.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Build C++ extension and wheel
        working-directory: ruda-torch/python
        timeout-minutes: 10
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 build tools were not found' }
          Import-Module (Join-Path $vs 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          $env:DISTUTILS_USE_SDK = '1'
          $env:MSSdk = '1'
          python setup.py bdist_wheel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ('${{ inputs.compile_only }}' -ne 'true') {
            python tests/check_native_load.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Save installable wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruda-torch-win-amd64-${{ steps.compatibility.outputs.python_tag }}-${{ steps.compatibility.outputs.abi_tag }}-torch${{ steps.compatibility.outputs.torch_version }}-abi10-${{ github.sha }}
          path: ruda-torch/python/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release wheels
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [linux, wheel]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      LINUX_PYTHON_VERSION: ${{ needs.linux.outputs.python_version }}
      LINUX_PYTHON_TAG: ${{ needs.linux.outputs.python_tag }}
      LINUX_ABI_TAG: ${{ needs.linux.outputs.abi_tag }}
      LINUX_TORCH_VERSION: ${{ needs.linux.outputs.torch_version }}
      WINDOWS_PYTHON_VERSION: ${{ needs.wheel.outputs.python_version }}
      WINDOWS_PYTHON_TAG: ${{ needs.wheel.outputs.python_tag }}
      WINDOWS_ABI_TAG: ${{ needs.wheel.outputs.abi_tag }}
      WINDOWS_TORCH_VERSION: ${{ needs.wheel.outputs.torch_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ruda-torch-*-torch*-abi10-${{ github.sha }}
          path: release
          merge-multiple: true
      - name: Assemble wheel compatibility manifest and checksums
        run: |
          python3 - <<'PY'
          import email
          import hashlib
          import json
          import os
          from pathlib import Path
          import tomllib
          import zipfile

          tag = os.environ['RELEASE_TAG']
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          if tag != f'v{version}':
              raise SystemExit('Release tag must match the workspace version')
          directory = Path('release')
          matrix = {
              'linux_x86_64': ('LINUX', 'libruda_torch_native.so', '.so', 'Ubuntu 24.04'),
              'win_amd64': ('WINDOWS', 'ruda_torch_native.dll', '.pyd', 'Windows 2022'),
          }
          wheels = sorted(directory.glob('*.whl'))
          if len(wheels) != len(matrix):
              raise SystemExit('Expected one Linux and one Windows wheel')
          packages = []
          for platform, (prefix, library, extension, build_os) in matrix.items():
              python = os.environ[f'{prefix}_PYTHON_VERSION']
              python_tag = os.environ[f'{prefix}_PYTHON_TAG']
              abi_tag = os.environ[f'{prefix}_ABI_TAG']
              torch = os.environ[f'{prefix}_TORCH_VERSION']
              major, minor = map(int, python.split('.'))
              wheel, = [p for p in wheels if p.name.endswith(f'-{python_tag}-{abi_tag}-{platform}.whl')]
              with zipfile.ZipFile(wheel) as archive:
                  names = archive.namelist()
                  metadata_name, = [n for n in names if n.endswith('.dist-info/METADATA')]
                  metadata = email.message_from_bytes(archive.read(metadata_name))
                  if metadata['Name'] != 'ruda-torch' or metadata['Version'] != version:
                      raise SystemExit(f'Unexpected package metadata in {wheel.name}')
                  if set(metadata['Requires-Python'].split(',')) != {f'>={python}', f'<{major}.{minor + 1}'}:
                      raise SystemExit(f'Unexpected Python requirement in {wheel.name}')
                  wheel_metadata_name, = [n for n in names if n.endswith('.dist-info/WHEEL')]
                  wheel_metadata = email.message_from_bytes(archive.read(wheel_metadata_name))
                  if f'{python_tag}-{abi_tag}-{platform}' not in wheel_metadata.get_all('Tag', []):
                      raise SystemExit(f'Unexpected wheel ABI tag in {wheel.name}')
                  if f'torch=={torch}' not in metadata.get_all('Requires-Dist', []):
                      raise SystemExit(f'Unexpected Torch requirement in {wheel.name}')
                  required = ['ruda_torch/__init__.py', f'ruda_torch/{library}']
                  required += [f'ruda_torch/licenses/{n}' for n in ('LICENSE', 'THIRD_PARTY_NOTICES.md', 'LICENSE.fla')]
                  if any(n not in names for n in required) or not any(n.startswith('ruda_torch/_C.') and n.endswith(extension) for n in names):
                      raise SystemExit(f'Missing packaged component in {wheel.name}')
              packages.append({'file': wheel.name, 'package_version': metadata['Version'],
                               'python': f'CPython {python}', 'python_tag': python_tag, 'python_abi': abi_tag,
                               'torch': torch, 'platform': platform,
                               'build_os': build_os, 'native_profile': 'release', 'native_abi': 10})
          manifest = {'release': tag, 'source_revision': os.environ['GITHUB_SHA'], 'wheels': packages}
          (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          files = sorted([*wheels, directory / 'manifest.json'])
          (directory / 'SHA256SUMS').write_text(''.join(f'{hashlib.file_digest(p.open("rb"), "sha256").hexdigest()}  {p.name}\n' for p in files), encoding='utf-8')
          PY
      - name: Publish a new GitHub Release
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Existing releases are not overwritten.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/*.whl release/manifest.json release/SHA256SUMS \
            --target "$GITHUB_SHA" --draft --title "RUDA $RELEASE_TAG" \
            --notes "RUDA source release with ruda-torch ${RELEASE_TAG#v} binary wheels. The wheels include the Python package, C++ extension, optimized Rust release library and license notices (native ABI 10).

          Linux x86_64 / CPython $LINUX_PYTHON_VERSION ($LINUX_ABI_TAG) / PyTorch $LINUX_TORCH_VERSION (Ubuntu 24.04 build); Windows x86_64 / CPython $WINDOWS_PYTHON_VERSION ($WINDOWS_ABI_TAG) / PyTorch $WINDOWS_TORCH_VERSION. These builds are not interchangeable. SHA256SUMS and manifest.json describe the downloads.

          [Installation and compatibility](https://github.com/$GH_REPO/blob/$GITHUB_SHA/ruda-torch/README.md#release-wheels) · [中文安装](https://github.com/$GH_REPO/blob/$GITHUB_SHA/docs/zh/native-pytorch-quickstart.md)"
          gh release edit "$RELEASE_TAG" --draft=false --latest
