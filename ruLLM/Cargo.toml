[package]
name = "ruda-llm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Model loading, training and autoregressive inference on the Ruda compute stack"
repository = "https://github.com/shuqi2077/RUDA"

[lib]
name = "rullm"

[features]
default = []
stack-autotune = ["ruda-tensor-device/stack-autotune"]
cann = ["dep:ruda-driver-cann", "rublas/cann", "rudnn/cann"]
amd = ["dep:ruda-driver-hip", "ruda-tensor/hip", "ruda-tensor-device/autotune"]
nvidia = ["ruda-tensor-device/cuda", "ruda-tensor-device/autotune", "dep:ruda-driver-cuda"]
nvidia-ptx = ["nvidia", "ruda-driver-cuda/direct-ptx"]
serving = ["dep:axum", "dep:tokio", "dep:async-stream", "dep:minijinja", "dep:minijinja-contrib", "dep:base64", "dep:reqwest"]
structured-output = ["serving", "dep:anyhow", "dep:llguidance", "dep:toktrie", "dep:toktrie_hf_tokenizers"]
libtorch = ["dep:ruda-tensor-tch", "dep:tch"]
tensor-parallel = ["ruda-tensor/distributed", "ruda-tensor-device/distributed", "ruda-tensor-tch?/distributed"]
expert-parallel = ["tensor-parallel"]
gpu-kv = ["serving", "nvidia", "ruda-driver-cuda/ucx-bridge"]
distributed = ["ruda-optim/collective", "dep:ruccl"]

[dependencies]
ruda-driver-cann = { version = "0.2.11", path = "../ruda-driver/cann", optional = true }
ruda-model = { version = "0.21.76", path = "../ruda-model", default-features = false, features = ["std"] }
ruda-autodiff = { version = "0.21.77", path = "../ruda-autodiff", default-features = false, features = ["std"] }
ruda-optim = { version = "0.21.83", path = "../ruda-optim", default-features = false, features = ["std"] }
ruccl = { version = "0.21.99", package = "ruCCL", path = "../ruCCL", default-features = false, optional = true }
ruda-nn = { version = "0.21.85", path = "../ruda-nn", default-features = false, features = ["std"] }
ruda-tensor = { version = "0.21.92", path = "../ruda-tensor", default-features = false, features = ["std", "kernel"] }
ruda-tensor-device = { version = "0.21.92", path = "../ruda-tensor/device", default-features = false, features = ["std", "fusion"] }
ruda-tensor-tch = { version = "0.21.96", path = "../ruda-tensor/tch", optional = true }
tch = { version = "0.22.0", optional = true }
ruda-store = { version = "0.21.75", path = "../ruda-store", default-features = false, features = ["std", "safetensors", "memmap"] }
ruda-kernel = { version = "0.1.58", path = "../ruda-kernel", default-features = false, features = ["frontend-std", "library", "packed-quantization"] }
ruda-core = { version = "0.1.14", path = "../ruda-core", default-features = false, features = ["std", "ir", "tensor"] }
ruda = { version = "0.1.59", path = "../ruda", default-features = false, features = ["runtime", "runtime-std", "runtime-storage-bytes"] }
ruda-driver-hip = { version = "0.2.11", path = "../ruda-driver/hip", default-features = false, features = ["std"], optional = true }
ruda-driver-cuda = { version = "0.2.11", path = "../ruda-driver/cuda", default-features = false, features = ["std"], optional = true }
rublas = { version = "0.2.11", path = "../ruBLAS", default-features = false, features = ["tensor-int4", "tensor-matmul", "tensor-ggml", "std"] }
rudnn = { version = "0.2.11", package = "ruDNN", path = "../ruDNN", default-features = false, features = ["tensor-gated-delta", "tensor-kda", "tensor-normalization", "tensor-paged-attention", "tensor-moe", "std"] }
half = "=2.7.1"
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
sha2 = "0.10"
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util"], optional = true }
async-stream = { version = "0.3", optional = true }
minijinja = { version = "2", features = ["json", "builtins"], optional = true }
minijinja-contrib = { version = "2", features = ["pycompat"], optional = true }
base64 = { version = "0.22.1", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
anyhow = { version = "1", optional = true }
llguidance = { version = "=1.2.0", default-features = false, features = ["lark"], optional = true }
toktrie = { version = "=1.4.0", optional = true }
toktrie_hf_tokenizers = { version = "=1.2.0", optional = true }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
libjpeg-turbo-rs = "=0.8.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[lints]
workspace = true

[[bin]]
name = "ruda-serve"
path = "src/bin/ruda-serve.rs"
required-features = ["serving"]

[[example]]
name = "qwen2_generate"
required-features = ["nvidia"]

[[example]]
name = "qwen35_generate"
required-features = ["nvidia"]

[dev-dependencies]
ruda-tensor-host = { path = "../ruda-tensor/host", default-features = false, features = ["std"] }

[[example]]
name = "qwen2_stream"
required-features = ["nvidia"]

[[example]]
name = "qwen2_amd"
required-features = ["amd"]

[[example]]
name = "qwen2_multi_gpu"
required-features = ["nvidia"]

[[example]]
name = "qwen2_autotune"
required-features = ["nvidia", "stack-autotune"]

[[example]]
name = "qwen2_autotune_amd"
path = "examples/qwen2_autotune_amd.rs"
required-features = ["amd", "stack-autotune"]

[[test]]
name = "stack_autotune_gpu"
path = "tests/stack_autotune_gpu.rs"
required-features = ["stack-autotune"]

[[example]]
name = "qwen35_generate_packed"
required-features = ["nvidia"]

[[example]]
name = "qwen2_continuous_batch"
required-features = ["nvidia"]

[[example]]
name = "qwen2_openai_server"
required-features = ["nvidia"]

[[example]]
name = "qwen2_sft"
required-features = ["nvidia"]
