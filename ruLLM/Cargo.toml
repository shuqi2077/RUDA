[package]
name = "ruda-llm"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Model loading and autoregressive inference on the Ruda compute stack"
repository = "https://github.com/shuqi2077/RUDA"

[lib]
name = "rullm"

[features]
default = []
stack-autotune = ["ruda-tensor-device/stack-autotune"]
cann = ["dep:ruda-driver-cann", "rublas/cann", "rudnn/cann"]
amd = ["dep:ruda-driver-hip", "ruda-tensor/hip", "ruda-tensor-device/autotune"]
nvidia = ["ruda-tensor-device/cuda", "ruda-tensor-device/autotune", "dep:ruda-driver-cuda"]
nvidia-ptx = ["nvidia", "ruda-driver-cuda/direct-ptx"]

[dependencies]
ruda-driver-cann = { version = "0.1.0", path = "../ruda-driver-cann", optional = true }
ruda-model = { version = "0.21.1", path = "../ruda-model", default-features = false, features = ["std"] }
ruda-nn = { version = "0.21.1", path = "../ruda-nn", default-features = false, features = ["std"] }
ruda-tensor = { version = "0.21.1", path = "../ruda-tensor", default-features = false, features = ["std", "kernel"] }
ruda-tensor-device = { version = "0.21.1", path = "../ruda-tensor-device", default-features = false, features = ["std", "fusion"] }
ruda-store = { version = "0.21.1", path = "../ruda-store", default-features = false, features = ["std", "safetensors", "memmap"] }
ruda-kernel = { version = "0.1.3", path = "../ruda-kernel", default-features = false, features = ["frontend-std", "library"] }
ruda-core = { version = "0.1.3", path = "../ruda-core", default-features = false, features = ["std", "ir", "tensor"] }
ruda = { version = "0.1.4", path = "../ruda", default-features = false, features = ["runtime", "runtime-std", "runtime-storage-bytes"] }
ruda-driver-hip = { version = "0.1.1", path = "../ruda-driver-hip", default-features = false, features = ["std"], optional = true }
ruda-driver-cuda = { version = "0.1.2", path = "../ruda-driver-cuda", default-features = false, features = ["std"], optional = true }
rublas = { version = "0.1.1", path = "../ruBLAS", default-features = false, features = ["tensor-int4", "tensor-matmul", "std"] }
rudnn = { version = "0.1.1", package = "ruDNN", path = "../ruDNN", default-features = false, features = ["tensor-gated-delta", "tensor-normalization", "std"] }
half = "=2.7.1"
chacha20 = { version = "=0.10.2", default-features = false, features = ["rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
libjpeg-turbo-rs = "=0.8.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[lints]
workspace = true

[[example]]
name = "qwen2_generate"
required-features = ["nvidia"]

[[example]]
name = "qwen35_generate"
required-features = ["nvidia"]

[dev-dependencies]
ruda-tensor-host = { path = "../ruda-tensor-host", default-features = false, features = ["std"] }

[[example]]
name = "qwen2_stream"
required-features = ["nvidia"]

[[example]]
name = "qwen2_amd"
required-features = ["amd"]

[[example]]
name = "qwen2_multi_gpu"
required-features = ["nvidia"]

[[example]]
name = "qwen2_autotune"
required-features = ["nvidia", "stack-autotune"]

[[example]]
name = "qwen2_autotune_amd"
path = "examples/qwen2_autotune_amd.rs"
required-features = ["amd", "stack-autotune"]

[[test]]
name = "stack_autotune_gpu"
path = "tests/stack_autotune_gpu.rs"
required-features = ["stack-autotune"]
