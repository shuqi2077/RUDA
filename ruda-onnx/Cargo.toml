[package]
name = "ruda-onnx"
version = "0.1.9"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Dilshod Tadjibaev", "Nathaniel Simard", "RUDA contributors"]
description = "ONNX graph import and native backend-generic RUDA model generation"

[features]
default = ["mmap"]
mmap = ["onnx-ir/mmap", "ruda-store/memmap"]

[dependencies]
onnx-ir = { version = "=0.22.0", default-features = false }
burn-tensor = { version = "=0.22.0", default-features = false }
ruda-tensor = { version = "0.21.91", path = "../ruda-tensor", features = ["api-std"] }
ruda-tensor-host = { version = "0.21.87", path = "../ruda-tensor/host" }
ruda-model = { version = "0.21.74", path = "../ruda-model", default-features = false, features = ["std"] }
ruda-nn = { version = "0.21.83", path = "../ruda-nn", default-features = false, features = ["std"] }
ruda-store = { version = "0.21.73", path = "../ruda-store", default-features = false, features = ["std", "rudapack"] }
clap = { version = "4.5", features = ["derive"] }
derive-new = "0.7"
log = "0.4"
proc-macro2 = "1.0.106"
quote = "1.0.45"
rust-format = { version = "0.3.4", features = ["pretty_please", "post_process"] }
syn = { version = "3.0.3", features = ["full", "extra-traits", "visit", "visit-mut"] }
tempfile = "3.24"
tracing-core = "0.1.36"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
insta = "1.46"

[[bin]]
name = "onnx2ruda"
path = "src/bin/onnx2ruda.rs"
