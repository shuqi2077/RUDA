[package]
name = "rublas"
version.workspace = true
edition.workspace = true
description = "Linear algebra and matrix multiplication for Ruda."
license-file = "LICENSE"
repository = "https://github.com/shuqi2077/RUDA"

[features]
cann = ["dep:ruda-driver-cann"]
default = ["kernel-ir", "std"]
tensor-int4 = ["kernel-ir", "ruda-kernel/device-tensor"]
tensor-matmul = ["kernel-ir", "ruda-kernel/device-tensor-dequantize"]
tensor-grouped = ["kernel-ir", "ruda-kernel/device-tensor"]
tensor-matmul-autotune = ["tensor-matmul"]
tensor-vector = ["kernel-ir", "ruda-kernel/device-tensor"]
kernel-ir = ["dep:ruda-core", "ruda-kernel/kernel-ir", "ruda/runtime", "dep:bytemuck", "dep:serde"]
std = ["kernel-ir", "ruda-kernel/frontend-std", "ruda-test-runtime/std"]
cpu-reference = ["kernel-ir", "dep:ruda-test-utils"]
heavy = []
extended = ["heavy"]
full = ["extended"]

[dependencies]
ruda-driver-cann = { version = "0.1.0", path = "../ruda-driver-cann", optional = true }
ruda-kernel = { version = "0.1.0", path = "../ruda-kernel", default-features = false }
ruda = { version = "0.1.0", path = "../ruda", default-features = false }
half = { version = "=2.7.1", features = ["alloc", "num-traits", "serde", "bytemuck"] }

[lints.rust]
unsafe_code = "deny"

[dependencies.bytemuck]
version = "1.16.1"
optional = true

[dependencies.serde]
version = "1.0.204"
features = ["derive", "alloc"]
default-features = false
optional = true

[dependencies.ruda-test-utils]
path = "../ruda-test-utils"
version = "0.1.0"
default-features = false
optional = true

[dev-dependencies.ruda-test-runtime]
path = "../ruda-test-runtime"
features = ["test-runtime"]
default-features = false

[dev-dependencies.ruda-kernel]
path = "../ruda-kernel"
features = ["quantization-kernels"]

[dev-dependencies.ruda-test-utils]
path = "../ruda-test-utils"
default-features = false

[dev-dependencies.pretty_assertions]
version = "1.4"

[dev-dependencies.trybuild]
version = "1"

[[test]]
name = "kernel_ir"
path = "tests/kernel_ir/lib.rs"
required-features = ["kernel-ir", "cpu-reference"]

[dependencies.ruda-core]
path = "../ruda-core"
version = "0.1.0"
default-features = false
optional = true
