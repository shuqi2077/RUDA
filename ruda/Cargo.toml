[package]
name = "ruda"
version = "0.1.58"
edition.workspace = true
readme = "README.md"
description = "Ruda GPU kernel API and portable runtime with CUDA, HIP and WGPU backends."
license-file = "../LICENSE"
repository = "https://github.com/shuqi2077/RUDA"

[features]
default = ["runtime-default"]
cuda = ["kernel", "dep:ruda-driver-cuda"]
hip = ["kernel", "dep:ruda-driver-hip"]
wgpu = ["kernel", "dep:ruda-driver-wgpu"]
cpu = ["kernel", "dep:ruda-driver-cpu"]
metal = ["kernel", "dep:ruda-driver-metal"]
direct-ptx = ["cuda", "ruda-driver-cuda/direct-ptx"]
kernel = ["runtime-default", "dep:ruda-kernel"]
runtime = ["ruda-runtime/runtime", "dep:ruda-core"]
runtime-autotune-checks = ["runtime", "ruda-runtime/runtime-autotune-checks"]
runtime-channel-cell = ["runtime", "ruda-runtime/runtime-channel-cell"]
runtime-channel-mpsc = ["runtime", "ruda-runtime/runtime-channel-mpsc"]
runtime-channel-mutex = ["runtime", "ruda-runtime/runtime-channel-mutex"]
runtime-default = ["runtime", "runtime-std", "runtime-channel-mutex", "runtime-channel-mpsc", "runtime-channel-cell", "runtime-storage-bytes", "ruda-runtime/runtime-default"]
runtime-exclusive-memory-only = ["runtime", "ruda-runtime/runtime-exclusive-memory-only"]
runtime-profile-tracy = ["runtime", "ruda-runtime/runtime-profile-tracy"]
runtime-std = ["runtime", "toml", "dirs", "ruda-runtime/runtime-std"]
runtime-persistence = ["runtime", "ruda-runtime/runtime-persistence"]
runtime-storage-bytes = ["runtime", "ruda-runtime/runtime-storage-bytes"]
runtime-tracing = ["runtime", "ruda-runtime/runtime-tracing"]
runtime-monitoring = ["runtime", "ruda-runtime/runtime-monitoring"]
monitoring-amdgpu-busy-percent = ["runtime", "ruda-runtime/monitoring-amdgpu-busy-percent"]
monitoring-intel-idle-residency = ["runtime", "ruda-runtime/monitoring-intel-idle-residency"]
monitoring-nvml = ["runtime", "ruda-runtime/monitoring-nvml"]
monitoring-gpu-engine-counters = ["runtime", "ruda-runtime/monitoring-gpu-engine-counters"]
monitoring-io-accelerator = ["runtime", "ruda-runtime/monitoring-io-accelerator"]
dirs = ["ruda-runtime/dirs"]
toml = ["ruda-runtime/toml"]

[dependencies]
ruda-core = { path = "../ruda-core", version = "0.1.14", default-features = false, features = ["ir", "tensor"], optional = true }
ruda-runtime = { path = "../ruda-runtime", version = "0.1.34", default-features = false }
ruda-kernel = { path = "../ruda-kernel", version = "0.1.58", optional = true }
ruda-driver-cuda = { path = "../ruda-driver/cuda", version = "0.2.10", optional = true }
ruda-driver-hip = { path = "../ruda-driver/hip", version = "0.2.10", optional = true }
ruda-driver-wgpu = { path = "../ruda-driver/wgpu", version = "0.2.10", optional = true }
ruda-driver-cpu = { path = "../ruda-driver/cpu", version = "0.2.11", optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
ruda-driver-metal = { path = "../ruda-driver/metal", version = "0.2.10", optional = true }

[dev-dependencies]
bytemuck = "1.16.1"
derive-new = { version = "0.7.0", default-features = false }
ruda-core = { path = "../ruda-core", version = "0.1.14", default-features = false, features = ["ir", "ir-serde", "tensor", "compiler", "communication"] }
rand = { version = "0.10.0", features = ["std_rng", "thread_rng"], default-features = false }
serial_test = "3.1.1"
test-log = { version = "^0.2", features = ["trace"], default-features = false }

[lints.rust]
unsafe_code = "deny"

[[test]]
name = "runtime"
path = "tests/runtime/integration_test.rs"
required-features = ["runtime"]

[[test]]
name = "stack_autotune"
path = "tests/runtime/stack_autotune.rs"
required-features = ["runtime", "runtime-std", "runtime-storage-bytes"]

[[bench]]
name = "runtime_memory"
path = "benches/runtime/dynamic.rs"
harness = false
required-features = ["runtime", "runtime-storage-bytes"]

[[example]]
name = "vector-add"
path = "examples/vector_add.rs"
required-features = ["kernel"]
