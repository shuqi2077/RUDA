[[test]]
name = "quantize"
path = "tests/quantize.rs"

[package]
edition = "2024"
name = "ruda-nn"
version = "0.21.0"
authors = [ "nathanielsimard <nathaniel.simard.42@gmail.com>",]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Ruda neural network layers, activation modules and losses."
documentation = "https://github.com/shuqi2077/RUDA/blob/main/docs/en/README.md"
readme = "README.md"
keywords = [ "deep-learning", "machine-learning", "tensor", "pytorch", "ndarray",]
categories = [ "science", "no-std", "embedded", "wasm",]
license = "MIT OR Apache-2.0"
repository = "https://github.com/shuqi2077/RUDA/tree/main/ruda-nn"

[features]
default = [ "std", "ruda-model/default",]
doc = [ "std", "ruda-model/doc",]
std = [ "ruda-model/std", "num-traits/std",]
sparse = [ "dep:serde", "ruda-tensor-device?/sparse",]
test-cuda = [ "cuda", "ruda-tensor-device/cuda-default", "ruda-core/id-tests-std",]
test-memory-checks = [ "fusion", "ruda-fusion/memory-checks",]
test-metal = [ "test-wgpu", "ruda-tensor-wgpu/metal",]
test-rocm = [ "ruda-tensor-rocm/default",]
test-tch = [ "ruda-tensor-tch/default",]
test-vulkan = [ "test-wgpu", "ruda-tensor-wgpu/vulkan",]
test-wgpu = [ "ruda-tensor-wgpu/default",]
tracing = [ "ruda-model/tracing", "ruda-tensor-device?/tracing", "ruda-tensor-rocm?/tracing", "ruda-tensor-tch?/tracing", "ruda-tensor-wgpu?/tracing", "ruda-fusion?/tracing",]
cuda = [ "dep:ruda-tensor-device", "serde/default", "serde_json/default",]
fusion = [ "dep:ruda-fusion", "ruda-kernel/frontend-std", "ruda-kernel/frontend-tracing", "ruda-core/id-tests-std",]

[lib]
name = "ruda_nn"
path = "src/lib.rs"

[dependencies.ruda-tensor-remote]
path = "../ruda-tensor-remote"
version = "0.21.1"
optional = true
default-features = false

[dependencies.ruda-tensor-rocm]
path = "../ruda-tensor-rocm"
version = "0.21.0"
optional = true
default-features = false

[dependencies.ruda-tensor-router]
path = "../ruda-tensor-router"
version = "0.21.1"
optional = true
default-features = false

[dependencies.ruda-tensor-tch]
path = "../ruda-tensor-tch"
version = "0.21.1"
features = [ "default",]
optional = true
default-features = false

[dependencies.ruda-tensor-wgpu]
path = "../ruda-tensor-wgpu"
version = "0.21.0"
optional = true
default-features = false

[dependencies.num-traits]
version = "0.2.19"
features = [ "libm",]
default-features = false

[dependencies.ruda-model]
default-features = false
path = "../ruda-model"
version = "0.21.0"

[dependencies.ruda-tensor-device]
optional = true
default-features = false
path = "../ruda-tensor-device"
version = "0.21.1"
features = [ "cuda",]

[dependencies.ruda-fusion]
features = [ "std", "tracing",]
optional = true
default-features = false
path = "../ruda-fusion"
version = "0.21.1"

[dependencies.ruda-kernel]
path = "../ruda-kernel"
version = "0.1.2"
default-features = false
optional = true
features = [ "frontend",]

[dependencies.ruda-core]
path = "../ruda-core"
version = "0.1.3"
default-features = false
optional = true

[dependencies.serde]
version = "1.0.228"
default-features = false
optional = true

[dependencies.serde_json]
version = "1.0.148"
default-features = false
optional = true

[dev-dependencies.ruda-tensor-host]
path = "../ruda-tensor-host"
features = [ "default",]
default-features = false

[dev-dependencies.rstest]
version = "0.26.1"

[dev-dependencies.ruda-autodiff]
features = [ "std", "tracing",]
default-features = false
path = "../ruda-autodiff"

[dev-dependencies.ruda-kernel]
path = "../ruda-kernel"
default-features = false
features = [ "frontend-std", "frontend-tracing",]

[lints.clippy]

[lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_html_tags = "deny"

[package.metadata.docs.rs]
features = [ "doc",]
rustdoc-args = [ "--cfg", "docsrs",]
